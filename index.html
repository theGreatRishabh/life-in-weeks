<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Life in Weeks - Interactive Life Calendar</title>
    <meta name="description" content="A modern, interactive life calendar to visualize your life in weeks, months, or years. Compare life expectancy and download or print your personalized timeline poster." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Non-blocking font load: preload stylesheet, swap to <link> once loaded -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      onload="this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body class="bg-background text-foreground font-sans transition-colors duration-300 antialiased selection:bg-primary/20 selection:text-primary">
    <div id="root" class="min-h-screen flex flex-col"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
