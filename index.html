<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Life in Weeks - Interactive Life Calendar</title>
    <meta name="description" content="A modern, interactive life calendar to visualize your life in weeks, months, or years. Compare life expectancy and download or print your personalized timeline poster." />
    <meta name="keywords" content="life in weeks, memento mori, life calendar, weeks of my life, stoicism, life expectancy calculator, printable poster" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://life-in-weeks.app/" />
    <meta property="og:title" content="Your Life in Weeks - Interactive Life Calendar" />
    <meta property="og:description" content="A modern, interactive life calendar to visualize your life in weeks, months, or years. Compare life expectancy and download or print your personalized timeline poster." />
    <meta property="og:image" content="https://life-in-weeks.app/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://life-in-weeks.app/" />
    <meta property="twitter:title" content="Your Life in Weeks - Interactive Life Calendar" />
    <meta property="twitter:description" content="A modern, interactive life calendar to visualize your life in weeks, months, or years. Compare life expectancy and download or print your personalized timeline poster." />
    <meta property="twitter:image" content="https://life-in-weeks.app/og-image.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://life-in-weeks.app/" />
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Non-blocking font load: preload stylesheet, swap to <link> once loaded -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      onload="this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body class="bg-background text-foreground font-sans transition-colors duration-300 antialiased selection:bg-primary/20 selection:text-primary">
    <div id="root" class="min-h-screen flex flex-col"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
